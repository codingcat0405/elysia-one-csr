server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed build assets never change — cache aggressively.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # SPA fallback: unknown paths (e.g. /login on hard reload) serve index.html
  # and React Router resolves the route client-side.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
